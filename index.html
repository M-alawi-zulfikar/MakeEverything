<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>MakeEverything - HTML & CSS to Video</title>
<meta name='description' content='Turn HTML and CSS animations into a video in your browser. Free and open source.'>
<link rel='icon' href='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E'>
<style>
:root{--bg:#0b0b14;--card:#14142a;--line:#2d2d52;--text:#f4f4ff;--muted:#b0b0cf;--a:#8b5cf6;--b:#22d3ee;--bad:#fda4af}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(900px 500px at 15% -10%,#2b1f5c,transparent),var(--bg)}
header{max-width:1100px;margin:0 auto;padding:28px 16px 8px}
h1{margin:0;font-size:clamp(30px,6vw,46px);letter-spacing:-1px}
h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px}
@media(min-width:900px){main{grid-template-columns:1fr 1fr;align-items:start}#out{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
label,.lab{font-weight:600;font-size:15px}
textarea{width:100%;height:340px;resize:vertical;background:#0c0c1e;color:#e8e8ff;border:1px solid var(--line);border-radius:12px;padding:12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;tab-size:2}
select,input{width:100%;min-height:44px;background:#0c0c1e;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
button,.btn{min-height:48px;border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.primary{background:linear-gradient(90deg,var(--a),#6366f1);color:#fff;width:100%;margin-top:14px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line);min-height:44px}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.wrap{display:flex;justify-content:center;margin-bottom:12px}
.stage{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#fff}
.stage iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.opts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.bar{height:10px;background:#0c0c1e;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
.err{color:var(--bad);background:#3a1220;border:1px solid #7f1d3a;border-radius:10px;padding:10px 12px;margin:12px 0 0}
video{width:100%;max-height:70vh;border-radius:12px;background:#000;margin-bottom:8px}
footer{text-align:center;color:var(--muted);padding:24px 16px 40px;font-size:14px}
a{color:var(--b)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>Make<span>Everything</span></h1>
<p>Turn HTML &amp; CSS animations into a video. Free, open source, and it all runs in your browser.</p>
</header>
<main>
<section class='card'>
<div class='row'><label for='code'>1. Write HTML + CSS</label><button class='ghost' id='reset' type='button'>Load example</button></div>
<textarea id='code' spellcheck='false' autocapitalize='off' autocomplete='off'></textarea>
<p class='hint'>HTML and CSS only (no JavaScript). For images, use data: URLs.</p>
</section>
<section class='card'>
<div class='lab' style='margin-bottom:8px'>2. Preview and settings</div>
<div class='wrap'><div class='stage' id='stage'><iframe id='preview' sandbox='allow-same-origin' title='Live preview'></iframe></div></div>
<div class='opts'>
<div><label for='size'>Size</label><select id='size'><option value='720x720'>Square 720</option><option value='720x1280'>Vertical 9:16</option><option value='1280x720'>Wide 16:9</option></select></div>
<div><label for='fps'>FPS</label><select id='fps'><option>15</option><option selected>24</option><option>30</option></select></div>
<div><label for='dur'>Seconds</label><input id='dur' type='number' min='1' max='30' value='5' inputmode='numeric'></div>
</div>
<button class='btn primary' id='go' type='button'>Make video</button>
<div id='prog' hidden><div class='bar' style='margin-top:14px'><i id='bar'></i></div><p class='hint' id='msg'></p><button class='ghost' id='cancel' type='button'>Cancel</button></div>
<p class='err' id='err' role='alert' hidden></p>
</section>
<section class='card' id='out' hidden>
<div class='lab' style='margin-bottom:8px'>3. Your video</div>
<video id='vid' controls playsinline></video>
<p class='hint' id='info'></p>
<a class='btn primary' id='dl' download>Download video</a>
</section>
</main>
<footer>MIT licensed &middot; <a href='https://github.com/M-alawi-zulfikar/MakeEverything'>Open source on GitHub</a> &middot; Made by Alawi</footer>
<script>
const $=s=>document.querySelector(s);
const EXAMPLE=`<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1e1b4b,#7c3aed);font-family:system-ui,sans-serif}
  .wrap{text-align:center}
  .box{width:160px;height:160px;margin:auto;border-radius:32px;background:#22d3ee;animation:spin 2s ease-in-out infinite alternate}
  h1{color:#fff;font-size:48px;margin:28px 0 0;animation:pop 1.2s ease-in-out infinite alternate}
  @keyframes spin{to{transform:rotate(180deg) scale(1.3);border-radius:50%;background:#f472b6}}
  @keyframes pop{to{transform:translateY(-16px);letter-spacing:4px}}
</style>
<div class='wrap'><div class='box'></div><h1>MakeEverything</h1></div>`;
const code=$('#code'),preview=$('#preview'),stage=$('#stage'),size=$('#size'),fps=$('#fps'),dur=$('#dur'),go=$('#go'),prog=$('#prog'),bar=$('#bar'),msg=$('#msg'),err=$('#err'),out=$('#out'),vid=$('#vid'),dl=$('#dl'),info=$('#info');
let busy=false,cancelled=false,timer,lastUrl;
const dims=()=>size.value.split('x').map(Number);
function layout(){
  const [w,h]=dims();
  const s=Math.min(1,(stage.parentElement.clientWidth||320)/w,520/h);
  preview.style.width=w+'px';preview.style.height=h+'px';
  preview.style.transform='scale('+s+')';
  stage.style.width=Math.round(w*s)+'px';stage.style.height=Math.round(h*s)+'px';
}
const sync=()=>{go.disabled=busy||!code.value.trim();};
function render(){preview.srcdoc=code.value;sync();}

// Properties copied from the live (animated) page onto each animated element.
const PROPS=['transform','transform-origin','opacity','color','background-color','background-image','background-size','background-position','border-color','border-width','border-radius','width','height','top','left','right','bottom','margin','padding','box-shadow','text-shadow','filter','font-size','font-weight','letter-spacing','clip-path','visibility'];
const BG=['background-color','background-image','background-size','background-position','background-repeat'];

// Draw the current look of the page onto the canvas (via an SVG foreignObject).
async function snap(ctx,doc,W,H){
  const win=doc.defaultView,html=doc.documentElement,body=doc.body;
  const root=doc.createElement('div');root.id='mk-root';
  const bc=body.cloneNode(true);root.appendChild(bc);
  const src=[html,body,...body.querySelectorAll('*')];
  const dst=[root,bc,...bc.querySelectorAll('*')];
  src.forEach((el,i)=>{
    if(!el.getAnimations().length)return;
    const cs=win.getComputedStyle(el);
    PROPS.forEach(p=>dst[i].style.setProperty(p,cs.getPropertyValue(p)));
  });
  const has=e=>{const c=win.getComputedStyle(e);return c.backgroundImage!=='none'||c.backgroundColor!=='rgba(0, 0, 0, 0)';};
  if(!has(html)){
    if(has(body)){const c=win.getComputedStyle(body);BG.forEach(p=>root.style.setProperty(p,c.getPropertyValue(p)));bc.style.setProperty('background','none');}
    else root.style.setProperty('background-color','#fff');
  }
  root.style.cssText+=';width:'+W+'px;height:'+H+'px;overflow:hidden;position:relative';
  let css='';
  for(const sh of doc.styleSheets){try{for(const r of sh.cssRules)css+=r.cssText+' ';}catch(e){}}
  css=css.replace(/:root/g,'#mk-root').replace(/(^|[ ,{}>+~])html(?=[ ,{.:#>+~[])/g,'$1#mk-root');
  css+=' #mk-root,#mk-root *{animation:none!important;transition:none!important}';
  const st=doc.createElement('style');st.textContent=css;root.prepend(st);
  const xml=new XMLSerializer().serializeToString(root);
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'><foreignObject width='100%' height='100%'>${xml}</foreignObject></svg>`;
  const img=new Image();
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('render'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
  ctx.drawImage(img,0,0,W,H);
}

async function make(){
  err.hidden=true;out.hidden=true;busy=true;cancelled=false;sync();
  prog.hidden=false;bar.style.width='0';msg.textContent='Getting ready...';
  const [W,H]=dims(),FPS=+fps.value,DUR=Math.min(30,Math.max(1,+dur.value||5));
  const frame=document.createElement('iframe');
  frame.sandbox='allow-same-origin';
  frame.style.cssText='position:fixed;left:-99999px;top:0;border:0;width:'+W+'px;height:'+H+'px';
  document.body.appendChild(frame);
  try{
    if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error('This browser cannot record video. Please use Chrome or Edge.');
    await new Promise(ok=>{frame.onload=ok;frame.srcdoc=code.value;});
    const doc=frame.contentDocument;
    doc.getAnimations().forEach(a=>{a.currentTime=0;});
    const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext('2d');
    await snap(ctx,doc,W,H);
    const type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
    const rec=new MediaRecorder(canvas.captureStream(FPS),type?{mimeType:type,videoBitsPerSecond:5000000}:undefined);
    const chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    const stopped=new Promise(ok=>{rec.onstop=ok;});
    rec.start(500);
    const t0=performance.now();let n=0;
    while(!cancelled&&performance.now()-t0<DUR*1000){
      await snap(ctx,doc,W,H);n++;
      const s=Math.min((performance.now()-t0)/1000,DUR);
      bar.style.width=(s/DUR*100)+'%';
      msg.textContent='Recording '+s.toFixed(1)+'s of '+DUR+'s. Keep this tab open.';
    }
    rec.stop();await stopped;
    if(cancelled)return;
    const mt=rec.mimeType||'video/webm';
    if(lastUrl)URL.revokeObjectURL(lastUrl);
    lastUrl=URL.createObjectURL(new Blob(chunks,{type:mt}));
    vid.src=lastUrl;dl.href=lastUrl;dl.download='makeeverything.'+(mt.includes('mp4')?'mp4':'webm');
    info.textContent='Done! Your device captured about '+Math.round(n/DUR)+' frames per second. Slower phones give choppier video.';
    out.hidden=false;out.scrollIntoView({behavior:'smooth'});
  }catch(e){
    err.textContent=e.message==='render'?'Could not draw your HTML. Check your code for typos, and use data: URLs for images.':e.message;
    err.hidden=false;
  }finally{
    frame.remove();busy=false;prog.hidden=true;sync();
  }
}

code.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,300);sync();});
size.addEventListener('change',layout);
addEventListener('resize',layout);
$('#reset').onclick=()=>{code.value=EXAMPLE;render();};
$('#cancel').onclick=()=>{cancelled=true;};
go.onclick=make;
code.value=EXAMPLE;render();layout();
</script>
</body>
</html>
